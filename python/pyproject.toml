[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prts-mcp"
version = "2.7.5.dev0"
description = "MCP Server for Arknights PRTS Wiki & game data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "3aKHP", url = "https://github.com/3aKHP" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "arknights",
    "prts",
    "prts-wiki",
    "game-data",
    "claude",
    "anthropic",
    "fanfiction",
    "ai-agent",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]==2.0.0",
    "httpx",
    "pydantic",
    # HTTP transport (PRTS_TRANSPORT=http). These are also transitively
    # required by mcp[cli], but we import uvicorn/starlette directly in
    # server.py so declare them explicitly to survive upstream reshuffling.
    "starlette>=0.27",
    "uvicorn>=0.31",
]

[project.urls]
Homepage = "https://github.com/3aKHP/prts-mcp"
Repository = "https://github.com/3aKHP/prts-mcp"
Changelog = "https://github.com/3aKHP/prts-mcp/blob/main/python/CHANGELOG.md"
"Bug Tracker" = "https://github.com/3aKHP/prts-mcp/issues"

[project.scripts]
prts-mcp = "prts_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prts_mcp"]

# Ship the repo-root IP notices with published artifacts. hatch_build.py
# materializes python/NOTICE (from the repo root, or reuses the copy already
# present in an sdist or Docker build context) so the single "NOTICE" source
# spelling resolves in every build context. The wheel maps the file into the
# package directory so it does not pollute site-packages.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist.force-include]
"NOTICE" = "NOTICE"

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "prts_mcp/NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
