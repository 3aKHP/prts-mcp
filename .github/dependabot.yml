# This file takes effect on the default branch (main).
# Disable routine version-update PRs for every configured ecosystem.
# Vulnerability alerts and security-update PRs are enabled separately in the
# repository settings. Security-update PRs initially target main; maintainers
# may retarget non-urgent fixes to develop (docs/dev/WORKFLOW.md). Review and CI
# remain required; open-pull-requests-limit does not limit security-update PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
