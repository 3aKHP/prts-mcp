# Dependabot reads this file from the default branch (`main`) only.
# Version-update PRs target `develop`; security updates follow the repository
# settings and always target the default branch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-patch-days: 3
    groups:
      rust-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
