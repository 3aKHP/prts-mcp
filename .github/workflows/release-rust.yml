name: Rust release candidates
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check one product version and publication scope
        env:
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: |
          node tools/release/check-version.mjs
          node --test tools/release/policy.test.mjs tools/npm/canonical-entry.test.mjs tools/release/publication.test.mjs
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node tools/release/check-version.mjs --release
          fi
  native:
    needs: version
    uses: ./.github/workflows/native-platforms.yml
  cargo-source:
    needs: version
    uses: ./.github/workflows/cargo-source.yml
  publish-crates:
    needs: [native, cargo-source]
    if: github.ref_type == 'tag' && vars.RUST_CRATES_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: rust-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the candidate Cargo toolchain
        run: rustup show
      - uses: actions/download-artifact@v8
        with:
          name: cargo-source-candidate
          path: artifacts/cargo
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish and verify the exact source candidate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RUST_CRATES_PUBLISH_ENABLED: 'true'
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: node tools/cargo/publish.mjs
  publish-npm:
    needs: [native, cargo-source]
    if: github.ref_type == 'tag' && vars.RUST_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: rust-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the audited OIDC-capable npm CLI
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-candidate
          path: artifacts/release
      - name: Publish exact-version dependencies before entry packages
        env:
          RUST_NPM_PUBLISH_ENABLED: 'true'
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: |
          node tools/release/check-version.mjs --release
          node tools/release/publish-npm.mjs
  publish-pypi:
    needs: [native, cargo-source]
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.RUST_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: rust-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-candidate
          path: artifacts/release
      - name: Verify candidate and prepare only unpublished wheels
        id: prepare
        env:
          RUST_PYPI_PUBLISH_ENABLED: 'true'
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: uv run --locked --project tools/pypi python tools/pypi/publish.py prepare
      - name: Upload immutable native wheels with OIDC attestations
        if: steps.prepare.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/pypi-upload/
      - name: Verify published file hashes and metadata
        env:
          RUST_PYPI_PUBLISH_ENABLED: 'true'
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: uv run --locked --project tools/pypi python tools/pypi/publish.py verify
      - name: Retain publication receipt
        uses: actions/upload-artifact@v6
        with:
          name: pypi-publication
          path: artifacts/pypi-publication.json
          retention-days: 14
  publish-non-npm:
    needs: [native, cargo-source, publish-npm, publish-crates, publish-pypi]
    if: >-
      always() && github.ref_type == 'tag' && vars.RUST_NON_NPM_PUBLISH_ENABLED == 'true' &&
      needs.native.result == 'success' &&
      needs.cargo-source.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: rust-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-candidate
          path: artifacts/release
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified native images and the candidate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
          RUST_NPM_PUBLISH_ENABLED: ${{ vars.RUST_NPM_PUBLISH_ENABLED }}
        run: |
          node tools/release/check-version.mjs --release
          node tools/release/publish-docker.mjs
          node tools/release/publish-github.mjs
