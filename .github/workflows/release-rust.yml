name: Rust release candidates
on:
  push:
    branches: ['release/v3.*']
    tags: ['v3.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check one product version and publication scope
        env:
          RUST_STABLE_RELEASE_ENABLED: ${{ vars.RUST_STABLE_RELEASE_ENABLED }}
        run: |
          node tools/release/check-version.mjs
          node --test tools/release/policy.test.mjs
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node tools/release/check-version.mjs --release
          fi
  native:
    needs: version
    uses: ./.github/workflows/native-platforms.yml
# The reusable native workflow collects all verified artifacts.
# Public publishing is added after candidate validation and maintainer identity setup.
# This preparation workflow has no OIDC, registry credentials or write permissions.
