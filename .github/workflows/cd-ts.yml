name: CD (TypeScript)

on:
  push:
    tags:
      - "ts/v[0-9]*.[0-9]*.[0-9]*"
      - "ts/v[0-9]*.[0-9]*.[0-9]*-*"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag scope vs branch
        run: |
          VERSION="${GITHUB_REF_NAME#ts/v}"
          if [[ "${VERSION}" != *-* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Stable tag (no -suffix) must be on main. Use -alpha.1 / -beta.1 / -rc.1 for pre-release tags on develop."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
              echo "::error::Pre-release tag (-suffix) must be on develop."
              exit 1
            fi
          fi
          echo "Tag scope verification passed."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ts/package.json'
          cache: 'npm'
          cache-dependency-path: 'ts/package-lock.json'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: ts

      - name: Build
        run: npx tsc
        working-directory: ts

      - name: Run tests
        run: npm test
        working-directory: ts

      - name: Check tag matches package version
        working-directory: ts
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ts/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Smoke test (health + tools/list)
        working-directory: ts
        run: |
          # Smoke test runs the published Bun entrypoint (the default
          # production runtime since 2.2.0) to verify the release artifact.
          bun dist/server-bun.js &
          SERVER_PID=$!
          for _ in $(seq 1 10); do
            if curl -sf http://localhost:3000/health; then break; fi
            sleep 1
          done
          node -e "
          const http = require('http');
          function post(body, headers) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify(body);
              const req = http.request({
                host: 'localhost', port: 3000, path: '/mcp', method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream', 'Content-Length': Buffer.byteLength(data), ...headers }
              }, res => { let buf = ''; res.on('data', d => buf += d); res.on('end', () => resolve({ headers: res.headers, body: buf })); });
              req.write(data); req.end();
            });
          }
          async function main() {
            const init = await post({ jsonrpc: '2.0', method: 'initialize', id: 1, params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'ci', version: '0' } } }, {});
            const sid = init.headers['mcp-session-id'];
            const list = await post({ jsonrpc: '2.0', method: 'tools/list', id: 2, params: {} }, { 'mcp-session-id': sid });
            const line = list.body.split('\n').find(l => l.startsWith('data: '));
            const result = JSON.parse(line.slice(6));
            const names = result.result.tools.map(t => t.name);
            const required = ['search_prts', 'prts_page', 'get_operator_archives', 'get_operator_voicelines', 'get_operator_basic_info', 'list_story_events', 'list_stories', 'read_story', 'read_activity'];
            for (const t of required) {
              if (!names.includes(t)) throw new Error('Missing tool: ' + t);
            }
            console.log('Smoke test passed:', names.sort().join(', '));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "
          kill $SERVER_PID

  package:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ts/package.json'
          cache: 'npm'
          cache-dependency-path: 'ts/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      - name: Install Python package (for fetch_gamedata script)
        run: python -m pip install -e python/

      - name: Fetch bundled gamedata
        run: python python/scripts/fetch_gamedata.py --output ts/data/gamedata

      - name: Download bundled storyjson zip
        run: |
          mkdir -p ts/data/storyjson
          DATA_TAG=$(gh release list --repo 3aKHP/arknights-data-pipeline --json tagName,createdAt --limit 100 --jq '[.[] | select(.tagName | startswith("data-"))] | max_by(.createdAt) | .tagName')
          gh release download "$DATA_TAG" \
            --repo 3aKHP/arknights-data-pipeline \
            --pattern "zh_CN.zip" \
            --dir ts/data/storyjson/ \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify bundled package data
        run: python python/scripts/check_package_data.py --data-root ts/data

      - name: Build and pack exact release artifact
        id: pack
        working-directory: ts
        run: |
          npm run build
          npm pack --json > pack.json
          TARBALL=$(node -e "const fs=require('fs'), path=require('path'); console.log(path.basename(JSON.parse(fs.readFileSync('pack.json','utf8'))[0].filename))")
          test -f "$TARBALL"
          tar -tzf "$TARBALL" | grep -q '^package/dist/server.js$'
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-release-package
          path: ts/${{ steps.pack.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    runs-on: ubuntu-latest
    needs: package
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ts/package.json'
          registry-url: 'https://registry.npmjs.org'

      - name: Download exact release artifact
        uses: actions/download-artifact@v4
        with:
          name: ts-release-package
          path: ts

      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#ts/v}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            echo "value=${PRERELEASE%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing)
        run: |
          TARBALL=$(find . -maxdepth 1 -name 'prts-mcp-ts-*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          VERSION="${GITHUB_REF_NAME#ts/v}"
          # Idempotent: re-running this job (a full rerun, not just --failed)
          # must not re-attempt publishing an immutable version that already
          # landed. npm publish on an existing version fails with
          # EPUBLISHCONFLICT; skip instead and let verification confirm bytes.
          if npm view "prts-mcp-ts@${VERSION}" version >/dev/null 2>&1; then
            echo "prts-mcp-ts@${VERSION} already published; skipping npm publish."
          else
            npm publish "$TARBALL" --provenance --access public --tag "${{ steps.dist_tag.outputs.value }}"
          fi
        working-directory: ts

  github-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ts/package.json'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download exact release artifact
        uses: actions/download-artifact@v4
        with:
          name: ts-release-package
          path: ts

      - name: Verify npm published bytes
        # Lives in github-release (not publish-npm) so a propagation timeout
        # fails this job alone: re-run with `gh run rerun <run-id> --failed`
        # re-verifies the now-propagated immutable tarball and creates the
        # release without re-attempting npm publish. See
        # docs/admin/release-cd-recovery.md.
        working-directory: ts
        run: |
          TARBALL=$(find . -maxdepth 1 -name 'prts-mcp-ts-*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          EXPECTED=$(sha256sum "$TARBALL" | awk '{print $1}')
          VERSION="${GITHUB_REF_NAME#ts/v}"
          TMP=$(mktemp); META=$(mktemp)
          trap 'rm -f "$TMP" "$META"' EXIT

          # 40 x 15s ~= 10 min, ~2.5x the observed ~4 min npm propagation.
          ATTEMPTS=40
          SLEEP=15
          LAST_HTTP="000"
          URL=""

          for attempt in $(seq 1 "$ATTEMPTS"); do
            TS=$(date +%s)
            URL=""; SHASUM=""; INTEGRITY=""
            # Cache-bust the per-version packument so a stale CDN 404 cannot
            # mask a publish that already landed on the registry. ?ts= is
            # ignored by the registry as an unknown query param.
            if curl -fsSL "https://registry.npmjs.org/prts-mcp-ts/${VERSION}?ts=${TS}" -o "$META" 2>/dev/null; then
              read -r URL SHASUM INTEGRITY < <(node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=m.dist||{};console.log(d.tarball||"",d.shasum||"",d.integrity||"")' < "$META") || true
            fi

            if [ -n "$URL" ]; then
              # Fetch without -f so %{http_code} is captured even on 4xx/5xx.
              # The body is only hashed when curl exited 0 (no interrupted
              # transfer) AND the status is 200; any other case is treated as
              # transient and retried, so a partial download is not misread
              # as a permanent byte mismatch. A non-200 carries only a small
              # error payload, not the 80 MB tarball.
              if HTTP=$(curl -sSL -o "$TMP" -w '%{http_code}' "${URL}?ts=${TS}" 2>/dev/null); then
                LAST_HTTP="$HTTP"
                if [ "$HTTP" = "200" ]; then
                  ACTUAL=$(sha256sum "$TMP" | awk '{print $1}')
                  if [ "$ACTUAL" = "$EXPECTED" ]; then
                    echo "npm tarball SHA-256 verified: $ACTUAL"
                    exit 0
                  fi
                  # npm versions are immutable post-publish: a retrievable byte
                  # mismatch is permanent, so fail fast instead of redownloading.
                  echo "::error::prts-mcp-ts@${VERSION} tarball is retrievable but its bytes differ from the exact release artifact."
                  echo "::error::expected sha256 (local artifact): ${EXPECTED}"
                  echo "::error::actual sha256   (registry tarball): ${ACTUAL}"
                  echo "::error::registry dist.shasum: ${SHASUM}"
                  echo "::error::registry dist.integrity: ${INTEGRITY}"
                  echo "::error::Do NOT create the GitHub Release; investigate first."
                  exit 1
                fi
              else
                # curl non-zero: connection failure or interrupted transfer
                # (e.g. partial body). Retry on the next iteration.
                LAST_HTTP="${HTTP:-000}"
              fi
            fi
            echo "Waiting for npm tarball propagation (attempt ${attempt}/${ATTEMPTS}, last HTTP ${LAST_HTTP})..."
            sleep "$SLEEP"
          done

          echo "::error::prts-mcp-ts@${VERSION} is published but the tarball was not retrievable after ${ATTEMPTS} attempts (~$((ATTEMPTS*SLEEP/60)) min); last tarball HTTP status ${LAST_HTTP}."
          echo "::error::This is a registry propagation delay, not a byte mismatch."
          echo "::error::expected sha256: ${EXPECTED}"
          echo "::error::tarball URL: ${URL:-<version document not visible yet>}"
          echo "::error::Recovery: wait for propagation, then re-run this github-release job (gh run rerun <run-id> --failed), or verify manually:"
          echo "::error::  curl -fsSL \"${URL:-<url>}?ts=\$(date +%s)\" | sha256sum"
          exit 1

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#ts/v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY' > release_notes.txt
          import re, os
          version = os.environ["VERSION"]
          text = open("ts/CHANGELOG.md").read()
          m = re.search(
              r"## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)",
              text, re.DOTALL
          )
          print(m.group(1).strip() if m else "See CHANGELOG.md for details.")
          PY

      - name: Append install instructions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Markdown code spans are intentionally literal.
          # shellcheck disable=SC2016
          printf '\n---\n\n**Install**\n```bash\n# Run directly with npx (Node.js entrypoint, zero extra runtime install)\nnpx prts-mcp-ts\n\n# Or install globally\nnpm install -g prts-mcp-ts@%s\n\n# Bun runtime (default production runtime since 2.2.0)\nbunx --bun -p prts-mcp-ts@%s prts-mcp-ts-bun\n```\n\nThe default Docker image (`prts-mcp-ts:latest`) runs under Bun since 2.2.0;\n`ts/Dockerfile.node` provides the legacy Node.js image.\n\nMCP endpoint: `http://localhost:3000/mcp`\n' \
            "$VERSION" \
            "$VERSION" >> release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.txt
          files: ts/prts-mcp-ts-*.tgz
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
