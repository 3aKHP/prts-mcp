name: Native platforms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: darwin-bench-${{ matrix.platform }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs', 'native/**', 'vendor/**', 'packaging/native/targets.json') }}
          restore-keys: native-${{ matrix.platform }}-
      - name: Native build with shared release helper
        run: node tools/native/build.mjs ${{ matrix.platform }}
      - uses: actions/cache@v6
        with:
          path: .runtime/npm-data
          key: npm-bundle-data-${{ hashFiles('packaging/npm/data-release.json') }}
          enableCrossOsArchive: true
      - name: Optimized native data preparation
        run: node tools/npm/prepare-data.mjs ${{ matrix.platform }}
      - name: Compile comparison helper with the same flags
        run: node --input-type=module -e "const n = await import('./tools/native/common.mjs'); n.run('cargo', ['build', '--locked', '--release', '--target', n.config.target, '--example', 'package_data_baseline'], {stdio:'inherit'});" ${{ matrix.platform }}
      - name: Paired full bundle preparation and inventory equality
        run: node tools/native/data-benchmark.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: data-benchmark-${{ matrix.platform }}
          path: artifacts/native/${{ matrix.platform }}/
