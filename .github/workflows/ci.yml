name: CI
on:
  push:
    branches: [main, develop, 'release/**', 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**', 'perf/**']
  pull_request:
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  rust-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain and check components
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'build.rs', 'native/**', 'vendor/**') }}
      - uses: actions/cache@v6
        with:
          path: .runtime/data
          key: frozen-oracle-data-${{ hashFiles('contracts/validation-assets.json') }}
      - name: Native tests, frozen differential suite and lifecycle
        run: ./scripts/check-runtime.sh --full
      - name: Verify standalone source package
        run: |
          node tools/check-source-package.mjs
          cargo package --locked
      - name: Retain scoped validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-validation-evidence
          path: artifacts/
          retention-days: 14
