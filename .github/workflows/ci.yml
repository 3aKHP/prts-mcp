name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.policy.outputs.full }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select verification tier and test CI policy
        id: policy
        run: |
          node tools/ci/policy.mjs select
          node --test tools/ci/policy.test.mjs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum Rust and isolate its build cache
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/msrv-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.89.0 --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/msrv-target
          key: msrv-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'native/**', 'vendor/**') }}
          restore-keys: msrv-${{ runner.os }}-1.89.0-
      - name: Check shipped binaries and packaging helper on minimum Rust
        run: cargo +1.89.0 check --locked --bins --example package_data
  rust-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain and check components
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs', 'native/**', 'vendor/**') }}
          restore-keys: rust-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: .runtime/data
          key: frozen-oracle-data-${{ hashFiles('contracts/validation-assets.json') }}
      - name: Native tests, frozen differential suite and lifecycle
        run: ./scripts/check-runtime.sh --full
      - name: Verify candidate publication and channel guards
        run: |
          node tools/release/check-version.mjs
          node --test tools/release/policy.test.mjs tools/npm/canonical-entry.test.mjs tools/release/publication.test.mjs
      - name: Verify standalone source package
        run: |
          node tools/check-source-package.mjs
          cargo package --locked
      - name: Retain scoped validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-validation-evidence
          path: artifacts/
          retention-days: 14
  native:
    needs: workflow-lint
    if: needs.workflow-lint.outputs.full == 'true'
    uses: ./.github/workflows/native-platforms.yml
  gate:
    name: CI gate
    if: always()
    needs: [workflow-lint, msrv, rust-validation, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected check to succeed
        env:
          CI_FULL: ${{ needs.workflow-lint.outputs.full }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/policy.mjs gate
  full-gate:
    # A skipped job counts as success in branch protection. Never emit the
    # required main check name for an ordinary run, even as a skipped job.
    name: ${{ needs.workflow-lint.outputs.full == 'true' && 'Full CI gate' || 'Full CI not requested' }}
    if: always() && needs.workflow-lint.outputs.full == 'true'
    needs: [workflow-lint, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful full verification
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
